<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f5465" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121b21" media="(prefers-color-scheme: dark)" />
    <title>Bonus · 离线</title>
    <style>
      :root { --paper: #eef2f1; --surface: #fff; --ink: #15212b; --muted: #55636e; --line: #d9e0e3; --brand: #0f5465; --on-brand: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --paper: #0b1216; --surface: #121b21; --ink: #e5edf0; --muted: #9fadb6; --line: #26343c; --brand: #6cc0d0; --on-brand: #062027; }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: var(--paper); color: var(--ink);
        font: 16px/1.5 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      main { width: 100%; max-width: 360px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 20px; }
      img { width: 64px; height: 64px; }
      h1 { font-size: 18px; margin: 12px 0 4px; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
      a { display: inline-grid; min-height: 44px; place-items: center; padding: 0 20px; border-radius: 9px; background: var(--brand); color: var(--on-brand); font: inherit; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>暂时无法连接</h1>
      <p>Bonus 需要联网才能读取你的数据。请检查网络后重试。</p>
      <a href="/">重试</a>
    </main>
  </body>
</html>
