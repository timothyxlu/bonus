    <path d="M256 384 V 116" stroke="#f2b04a" stroke-width="16" stroke-linecap="round"/>
    <path d="M256 62 L296 128 L256 112 L216 128 Z" fill="#f2b04a" stroke="#f2b04a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M224 414 L256 384 L288 414 M224 444 L256 414 L288 444" fill="none" stroke="#f2b04a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
