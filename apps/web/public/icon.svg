      <stop offset="0" stop-color="#0a2733"/><stop offset="1" stop-color="#12606f"/>
    </linearGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe3ea"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe3ea"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(35.5 -34) rotate(45 256 256) translate(0 34)">
